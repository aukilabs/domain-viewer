name: Trivy scan

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  scan:
    name: Scan dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Filesystem scan reads package-lock.json so Next.js CVEs (e.g. React2Shell)
      # are visible even when the production image is a Next standalone build.
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.76.0
          format: json
          output: trivy.json
          exit-code: "1"
          severity: HIGH,CRITICAL
          scanners: vuln
          timeout: 20m
          cache: "false"

      - name: Upload the report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-domain-viewer
          path: trivy.json
          retention-days: 30

      - name: Write the job summary
        if: success() || failure()
        run: |
          set -euo pipefail
          {
            echo "### domain-viewer (filesystem)"
            echo
            echo "Trivy v0.76.0. High and critical only. The JSON artifact is the full list."
            echo
            jq -r '
              def vulns: [.Results[]?.Vulnerabilities[]?];
              vulns as $v
              | ($v | map(select(.Severity == "CRITICAL")) | length) as $crit
              | ($v | map(select(.Severity == "HIGH")) | length) as $high
              | ($v | group_by(.PkgName + "\u0000" + .InstalledVersion) | sort_by(-length)) as $pkgs
              | "Critical: \($crit)",
                "High: \($high)",
                "",
                (if ($crit + $high) == 0 then
                  "No high or critical findings."
                else
                  "| Package | Installed | Findings | Fixed in |",
                  "| --- | --- | ---: | --- |",
                  ($pkgs[:25][]
                    | .[0] as $p
                    | ([.[].FixedVersion | select(. != null and . != "")] | unique | join(", ")) as $fix
                    | "| \($p.PkgName) | \($p.InstalledVersion) | \(length) | \(if $fix == "" then "none" else $fix end) |"),
                  (if ($pkgs | length) > 25 then
                    "",
                    "The artifact has the remaining packages."
                  else
                    empty
                  end)
                end)
            ' trivy.json
          } >> "$GITHUB_STEP_SUMMARY"
