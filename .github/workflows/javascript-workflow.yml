name: JavaScript workflow

on:
  workflow_call:
    secrets:
      docker_username:
        required: false
      docker_password:
        required: false
      argocd_host:
        required: false
      argocd_token:
        required: false
      npm_publisher_token:
        required: false
    inputs:
      enable_build:
        default: false
        type: boolean
      enable_tag_latest:
        default: false
        type: boolean
      enable_sync:
        default: false
        type: boolean
      enable_restart:
        default: false
        type: boolean
      image_name:
        required: false
        type: string
      argocd_app:
        type: string
        required: false
jobs:
  build:
    name: JavaScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Configure environment
        run: |
          image_name="${{ github.event.repository.name }}"
          if [ -n "${{ inputs.image_name }}" ]; then
            image_name="${{ inputs.image_name }}"
          fi
          lowercase_image_name="${image_name,,}"
          echo "IMAGE_NAME=${lowercase_image_name}" >> $GITHUB_ENV
          argocd_app="${lowercase_image_name}"
          if [ -n "${{ inputs.argocd_app }}" ]; then
            argocd_app="${{ inputs.argocd_app }}"
          fi
          lowercase_argocd_app="${argocd_app,,}"
          echo "ARGOCD_APP=${lowercase_argocd_app}" >> $GITHUB_ENV
      - name: Check out code
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        if: ${{ inputs.enable_build  }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_password }}
      - name: Set up Docker Buildx
        if: ${{ inputs.enable_build  }}
        uses: docker/setup-buildx-action@v3
      - name: Docker build and push
        if: ${{ inputs.enable_build }}
        run: |
          # Branch or tag name with / replaced by __
          ref_name_tag="$(echo "${{ github.ref_name }}" | sed 's@/@__@g')"

          tags="-t aukilabs/${IMAGE_NAME}:${{ github.sha }} -t aukilabs/${IMAGE_NAME}:${ref_name_tag}"
          test "${{ inputs.enable_tag_latest }}" = "true" && tags="${tags} -t aukilabs/${IMAGE_NAME}:latest"

          next_build_args="--build-arg NEXT_PUBLIC_AMPLITUDE_API_KEY=__NEXT_PUBLIC_AMPLITUDE_API_KEY__"

          docker buildx create --use
          docker buildx build $next_build_args --platform linux/amd64 $tags --push .

      - name: Set up Argo CD
        if: ${{ inputs.enable_sync || inputs.enable_restart }}
        shell: bash
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.argocd_token }}
          ARGOCD_HOST: ${{ secrets.argocd_host }}
        run: |
          set -euo pipefail
          version=v3.6.1
          asset=argocd-linux-amd64
          pinned=46d2fc941071f0a0c36326a67a431d34b1479e1a24737f7b367abc93968beadc
          dir="${RUNNER_TEMP}/argocd-cli"
          mkdir -p "$dir"
          base="https://github.com/argoproj/argo-cd/releases/download/${version}"
          curl -fsSL -o "$dir/$asset" "$base/$asset"
          curl -fsSL -o "$dir/cli_checksums.txt" "$base/cli_checksums.txt"
          published="$(awk -v asset="$asset" '$2 == asset { print $1 }' "$dir/cli_checksums.txt")"
          if [ "$published" != "$pinned" ]; then
            echo "Checksum for ${asset} does not match." >&2
            exit 1
          fi
          echo "${pinned}  ${asset}" | (cd "$dir" && sha256sum -c -)
          install -m 0755 "$dir/$asset" "$dir/argocd"
          echo "$dir" >> "$GITHUB_PATH"
          host="${ARGOCD_HOST}:443"
          argocd account get-user-info --server "$host" --grpc-web --auth-token "$ARGOCD_AUTH_TOKEN" >/dev/null
          {
            echo "ARGOCD_SERVER=${host}"
            echo "ARGOCD_AUTH_TOKEN=${ARGOCD_AUTH_TOKEN}"
          } >> "$GITHUB_ENV"
      - name: Sync ArgoCD app
        if: ${{ inputs.enable_sync }}
        run: argocd app sync "${{ env.ARGOCD_APP }}" --grpc-web --async
      - name: Restart ArgoCD app
        if: ${{ inputs.enable_restart }}
        run: argocd app actions run "${{ env.ARGOCD_APP }}" restart --kind Deployment --resource-name "${{ env.ARGOCD_APP }}" --grpc-web
